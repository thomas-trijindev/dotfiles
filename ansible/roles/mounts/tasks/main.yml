---
# =============================================================================
# NAS MOUNTS - roles/mounts/tasks/main.yml
# =============================================================================
#
# PURPOSE:
#   Configure autofs for on-demand SMB/CIFS NAS mounts. Shares mount under
#   /mnt/<share> on access and unmount after nas_autofs_timeout seconds idle.
#
# PREREQUISITES:
#   - Tailscale must be installed and authenticated (nas_host is a Tailscale IP)
#   - nas_username and nas_password must be supplied at runtime via vault or -e
#
# USAGE:
#   ansible-playbook local.yml --tags mounts
#   ansible-playbook local.yml -e "install_autofs=true nas_username=X nas_password=Y"
#
# =============================================================================

- name: Get primary user UID
  ansible.builtin.command: id -u {{ primary_user }}
  register: mounts_user_uid
  changed_when: false

- name: Install autofs and SMB dependencies
  ansible.builtin.dnf:
    name:
      - autofs
      - cifs-utils
      - cronie
    state: present

- name: Enable crond service
  ansible.builtin.systemd:
    name: crond
    enabled: yes
    state: started

- name: Create /etc/samba directory
  ansible.builtin.file:
    path: /etc/samba
    state: directory
    mode: '0755'

- name: Write NAS credentials file
  ansible.builtin.copy:
    dest: "{{ nas_credentials_file }}"
    content: |
      username={{ nas_username }}
      password={{ nas_password }}
    mode: '0600'
    owner: root
    group: root
  no_log: true
  notify: Restart autofs

- name: Create autofs drop-in directory
  ansible.builtin.file:
    path: /etc/auto.master.d
    state: directory
    mode: '0755'

- name: Deploy autofs master map entry
  ansible.builtin.template:
    src: smb.autofs.j2
    dest: /etc/auto.master.d/smb.autofs
    mode: '0644'
  notify: Restart autofs

- name: Deploy SMB map file
  ansible.builtin.template:
    src: auto.smb.j2
    dest: /etc/auto.smb
    mode: '0644'
  notify: Restart autofs

- name: Ensure mount base exists
  ansible.builtin.file:
    path: "{{ nas_mount_base }}"
    state: directory
    mode: '0755'

- name: Enable and start autofs
  ansible.builtin.systemd:
    name: autofs
    enabled: yes
    state: started

- name: Deploy NAS health check script
  ansible.builtin.template:
    src: nas-health-check.sh.j2
    dest: /usr/local/bin/nas-health-check.sh
    mode: '0755'

- name: Schedule NAS health check cron job
  ansible.builtin.cron:
    name: "NAS health check"
    minute: "*/5"
    job: "/usr/local/bin/nas-health-check.sh"
    user: root
