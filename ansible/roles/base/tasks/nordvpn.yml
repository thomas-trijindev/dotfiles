---
# =============================================================================
# NORDVPN INSTALLATION - roles/base/tasks/nordvpn.yml
# =============================================================================
#
# PURPOSE:
#   Install NordVPN client on Fedora via the official NordVPN RPM repository.
#
# POST-INSTALL STEPS (manual):
#   1. Log in: nordvpn login
#   2. Connect: nordvpn connect
#   3. Optional: nordvpn set killswitch on
#
# FEATURE FLAG:
#   Controlled by 'install_nordvpn' variable in group_vars/all.yml
#
# =============================================================================

- name: Add NordVPN GPG key
  ansible.builtin.rpm_key:
    key: https://repo.nordvpn.com/gpg/nordvpn_public.asc
    state: present

- name: Add NordVPN repository
  ansible.builtin.yum_repository:
    name: nordvpn
    description: NordVPN
    baseurl: https://repo.nordvpn.com/yum/nordvpn/centos/$basearch
    gpgkey: https://repo.nordvpn.com/gpg/nordvpn_public.asc
    gpgcheck: yes
    enabled: yes

- name: Install nordvpn package
  ansible.builtin.dnf:
    name: nordvpn
    state: present

- name: Add user to nordvpn group
  ansible.builtin.user:
    name: "{{ primary_user }}"
    groups: nordvpn
    append: yes

- name: Enable nordvpnd service
  ansible.builtin.systemd:
    name: nordvpnd
    enabled: yes
    state: started
