---
# =============================================================================
# BASE ROLE - roles/base/tasks/main.yml
# =============================================================================
#
# PURPOSE:
#   Entry point for the base role. This role installs packages and tools
#   that should be present on all machines regardless of their purpose.
#
# WHAT THIS ROLE INSTALLS:
#   1. System packages   - Common CLI tools (git, neovim, ripgrep, etc.)
#   2. NordVPN           - VPN client (optional, controlled by feature flag)
#   3. chezmoi           - Dotfiles manager (optional, controlled by feature flag)
#   4. Claude Code       - AI coding assistant (optional, controlled by feature flag)
#
# HOW TO ADD NEW COMPONENTS:
#   1. Create a new task file (e.g., mytool.yml)
#   2. Add import_tasks entry below with appropriate 'when' condition
#   3. Add feature flag in group_vars/all.yml if it should be optional
#
# HOW TO DISABLE COMPONENTS:
#   Set the feature flag to false in group_vars/all.yml, e.g.:
#     install_nordvpn: false
#
# =============================================================================

# Install standard packages from distribution repositories
# See packages.yml for the package lists
- name: Install standard packages
  ansible.builtin.import_tasks: packages.yml

# Install NordVPN client
# Uses different methods per platform: AUR on Arch, cask on macOS
# Controlled by install_nordvpn variable (default: false)
- name: Install NordVPN
  ansible.builtin.import_tasks: nordvpn.yml
  when: install_nordvpn | default(false)

# Install oh-my-zsh framework with spaceship-prompt and plugins
# Controlled by install_ohmyzsh variable (default: false)
- name: Install oh-my-zsh
  ansible.builtin.import_tasks: ohmyzsh.yml
  when: install_ohmyzsh | default(false)

# Install chezmoi dotfiles manager and apply dotfiles repo
# Controlled by install_chezmoi variable (default: false)
- name: Install chezmoi
  ansible.builtin.import_tasks: chezmoi.yml
  when: install_chezmoi | default(false)

# Install mise runtime version manager
# Controlled by install_mise variable (default: false)
- name: Install mise
  ansible.builtin.import_tasks: mise.yml
  when: install_mise | default(false)

# Install Claude Code AI assistant CLI
# Downloads from claude.ai official installer
# Controlled by install_claude variable (default: false)
- name: Install Claude Code
  ansible.builtin.import_tasks: claude.yml
  when: install_claude | default(false)

# Install Tailscale VPN — required before NAS mounts if NAS is on Tailscale
# After install, run 'tailscale up' manually to authenticate
- name: Install Tailscale
  ansible.builtin.import_tasks: tailscale.yml
  when: install_tailscale | default(false)

# Configure built-in OpenSSH agent via systemd user service
# Ensures SSH_AUTH_SOCK points to the built-in agent, not 1Password
# Linux only — macOS uses the system keychain agent automatically
- name: Configure built-in SSH agent
  ansible.builtin.import_tasks: ssh_agent.yml
  when:
    - install_ssh_agent | default(true)
    - ansible_facts['os_family'] != "Darwin"
