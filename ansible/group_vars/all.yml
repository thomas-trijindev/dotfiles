---
# =============================================================================
# GLOBAL VARIABLES - group_vars/all.yml
# =============================================================================
#
# PURPOSE:
#   Central configuration file for all Ansible variables. Change settings here
#   to customize what gets installed and how your system is configured.
#
# HOW THIS FILE WORKS:
#   - Variables defined here are available in ALL tasks and templates
#   - You can override these with command line: -e "variable=value"
#   - More specific group_vars files would override these (e.g., group_vars/laptops.yml)
#
# SECTIONS:
#   1. User Configuration     - Who the playbook configures
#   2. Feature Flags          - Toggle optional software installations
#   3. Packages               - Lists of packages per distribution
#   4. SSH Configuration      - SSH hardening settings (if ssh role enabled)
#
# =============================================================================


# =============================================================================
# USER CONFIGURATION
# =============================================================================
# Who is the primary user to configure? This user will:
#   - Own installed user services
#   - Be added to necessary groups (nordvpn, etc.)
#   - Have chezmoi/dotfiles configured
#
# Uses $USER environment variable, falls back to 'tjunkie' if not set

primary_user: "{{ lookup('env', 'USER') | default('tjunkie', true) }}"


# =============================================================================
# FEATURE FLAGS
# =============================================================================
# Toggle optional software installations on/off.
# Set to 'false' to skip installation of that component.
#
# HOW TO OVERRIDE ON COMMAND LINE:
#   ansible-playbook local.yml -e "install_nordvpn=false"

# NordVPN - VPN client (installs via official NordVPN installer)
install_nordvpn: true

# chezmoi - Dotfiles manager (https://chezmoi.io)
# Installs chezmoi and applies this dotfiles repo
install_chezmoi: true

# Claude Code - Anthropic's AI coding assistant CLI
install_claude: true

# oh-my-zsh + spaceship prompt + plugins
# Installs oh-my-zsh, spaceship-prompt, zsh-autosuggestions, zsh-syntax-highlighting
install_ohmyzsh: true

# mise - polyglot runtime version manager (replaces nvm, pyenv, etc.)
install_mise: true

# Tailscale VPN — install before enabling NAS mounts (NAS is on Tailscale)
# After install, run 'tailscale up' manually to authenticate
install_tailscale: false

# AutoFS NAS mounts — requires Tailscale to be up and nas_host set to Tailscale IP
# Enable after Tailscale is authenticated
install_autofs: false

# GDM login screen power management (Fedora/GNOME only)
# Prevents suspend on AC when no user is logged in; suspends on battery after idle
configure_power: true

# Built-in SSH agent via systemd user service (Linux only)
# Enables ssh-agent.service and sets SSH_AUTH_SOCK via environment.d
# Set to false if you use 1Password or another SSH agent manager
install_ssh_agent: true

# Dotfiles repo to apply via chezmoi after installing it
# Format: "github-username/repo" or full URL
chezmoi_dotfiles_repo: "thomas-trijindev/dotfiles"


# =============================================================================
# PACKAGES
# =============================================================================
# Package lists organized by distribution. Each distro installs:
#   packages_common + packages_<distro>
#
# HOW TO ADD PACKAGES:
#   1. Add to packages_common for all distros (if package name is same)
#   2. Add to distro-specific list if name differs or not available everywhere
#
# PACKAGE NAME DIFFERENCES:
#   - fd:      'fd-find' on Fedora/RHEL, 'fd' on macOS (via Homebrew)
#   - fortune: 'fortune-mod' on Fedora, 'fortune' on macOS (via Homebrew)

# Packages installed on ALL distributions
packages_common:
  - git       # Version control
  - curl      # URL transfer tool
  - wget      # URL downloader
  - btop      # Resource monitor (better than htop)
  - tmux      # Terminal multiplexer
  - neovim    # Modern vim editor
  - ripgrep   # Fast grep replacement (command: rg)
  - fzf       # Fuzzy finder
  - unzip     # Archive extraction
  - jq        # JSON processor

# Fedora specific packages (via dnf)
packages_fedora:
  - fd-find                 # Fast find replacement (note: command is 'fdfind' or 'fd' via symlink)
  - bat                     # Cat with syntax highlighting
  - eza                     # Modern ls replacement
  - zsh                     # Z shell
  - zsh-autosuggestions     # Fish-like autosuggestions
  - zsh-syntax-highlighting # Fish-like syntax highlighting
  - fastfetch               # Fast system info display
  - cowsay                  # Cowsay ascii art
  - fortune-mod             # Fortune cookie quotes
  - lolcat                  # Rainbow colouriser
  - autojump                # Directory jump shortcut (j)
  - gh                      # GitHub CLI

# macOS specific packages (via Homebrew)
packages_macos:
  - fd          # Fast find replacement
  - bat         # Cat with syntax highlighting
  - eza         # Modern ls replacement
  - autojump    # Directory jump shortcut (j)
  - fastfetch   # Fast system info display
  - cowsay      # Cowsay ascii art
  - fortune     # Fortune cookie quotes
  - lolcat      # Rainbow colouriser
  - gh          # GitHub CLI


# =============================================================================
# NAS MOUNTS
# =============================================================================
# AutoFS SMB/CIFS mounts for NAS shares. Mounts on-demand under nas_mount_base,
# unmounts after nas_autofs_timeout seconds of inactivity.
#
# PREREQUISITES:
#   - Tailscale must be installed and authenticated
#   - nas_host must be the NAS Tailscale IP (100.x.x.x), not the LAN IP
#
# CREDENTIALS: supply at runtime via vault or -e — do NOT commit real values.
#   ansible-playbook local.yml -e "nas_username=X nas_password=Y"

nas_host: "192.168.0.6"             # UPDATE to Tailscale IP (100.x.x.x)
nas_mount_base: "/mnt"
nas_credentials_file: "/etc/samba/credentials"
nas_autofs_timeout: 60              # Unmount after this many seconds of inactivity

nas_username: ""                    # Override at runtime — do not commit
nas_password: ""                    # Override at runtime — do not commit

nas_shares:
  - maps
  - reference_drawings
  - reject_images


# =============================================================================
# SSH CONFIGURATION
# =============================================================================
# Settings for the SSH role (currently disabled in local.yml)
# These harden SSH by disabling password auth and limiting access
#
# TO ENABLE: Uncomment the ssh role in local.yml

ssh_port: 22                           # SSH port (consider changing for security)
ssh_permit_root_login: "no"            # Disable root SSH login
ssh_password_authentication: "no"      # Require SSH keys, no passwords
ssh_pubkey_authentication: "yes"       # Enable public key authentication
ssh_challenge_response: "no"           # Disable challenge-response auth
ssh_use_pam: "yes"                     # Use PAM for authentication

ssh_max_auth_tries: 3                  # Max failed auth attempts
ssh_max_sessions: 5                    # Max concurrent sessions
ssh_client_alive_interval: 300         # Send keepalive every 5 minutes
ssh_client_alive_count_max: 2          # Disconnect after 2 missed keepalives

# Users allowed to SSH into this machine
ssh_allowed_users:
  - "{{ primary_user }}"
